<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class roster</title>
  <style>
    :root { --bg:#f6f3ec; --ink:#1d1b18; --muted:#6b655b; --line:#d9d2c3; --accent:#3b5bdb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#171614; --ink:#ece7dc; --muted:#9b9486; --line:#34312c; --accent:#8fa6ff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font: 17px/1.55 Georgia, "Times New Roman", serif; }
    main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: 2.4rem; line-height:1.1; margin:0 0 .4rem; font-weight: normal; }
    p.sub { color:var(--muted); margin:0 0 2.5rem; }
    h2 { font: 600 1rem/1.3 system-ui, sans-serif; margin: 2.5rem 0 1rem; }
    .avgs { display:grid; grid-template-columns: repeat(auto-fit, minmax(9rem,1fr)); gap:1px;
            background:var(--line); border:1px solid var(--line); }
    .avgs div { background:var(--bg); padding:1rem; }
    .avgs b { display:block; font-size:1.8rem; font-weight:normal; }
    .avgs span { color:var(--muted); font: .85rem system-ui, sans-serif; }
    .bar { display:flex; justify-content:space-between; align-items:baseline; }
    button { font: 600 .9rem system-ui, sans-serif; padding:.55rem 1rem; border:1px solid var(--ink);
             background:transparent; color:var(--ink); cursor:pointer; }
    button:hover { background:var(--ink); color:var(--bg); }
    ol { padding-left:1.6rem; columns: 2 14rem; column-gap: 2rem; }
    li { padding:.2rem 0; break-inside: avoid; }
  </style>
</head>
<body>
<main>
  <h1>The class, from the database</h1>
  <p class="sub">{{ names|length }} students, read live from Postgres.</p>

  <h2>Average self-rated skill (1–5)</h2>
  <div class="avgs">
    {% for label, value in averages %}
      <div><b>{{ value }}</b><span>{{ label }}</span></div>
    {% endfor %}
  </div>

  <div class="bar">
    <h2>Students</h2>
    <button id="shuffle">Shuffle</button>
  </div>
  <ol id="names">
    {% for n in names %}<li>{{ n }}</li>{% endfor %}
  </ol>
</main>
<script src="{{ url_for('static', filename='shuffle.js') }}"></script>
</body>
</html>
